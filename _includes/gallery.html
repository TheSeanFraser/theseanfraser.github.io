<!-- The Photo Gallery Grid -->
<div class="custom-photo-gallery">
  {% for image in page.gallery_images %}
    <div class="gallery-item">
      <img src="{{ image.url | relative_url }}" alt="{{ image.alt }}" loading="lazy" onclick="openLightbox(this)">
    </div>
  {% endfor %}
</div>

<!-- The Lightbox Modal Overlay -->
<div id="galleryLightbox" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-content" id="lightboxImage" alt="Enlarged gallery view">
  <div id="lightboxCaption"></div>
</div>

<script>
function openLightbox(element) {
  const lightbox = document.getElementById("galleryLightbox");
  const lightboxImg = document.getElementById("lightboxImage");
  const captionText = document.getElementById("lightboxCaption");
  
  lightbox.style.display = "flex";
  lightboxImg.src = element.src;
  captionText.innerHTML = element.alt;
}

function closeLightbox() {
  const lightbox = document.getElementById("galleryLightbox");
  lightbox.style.display = "none";
}

// Optional: Close lightbox using the Escape key
document.addEventListener('keydown', function(event) {
  if (event.key === "Escape") {
    closeLightbox();
  }
});
</script>
